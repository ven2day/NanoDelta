name: nanodelta
services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nanodelta}
      POSTGRES_USER: ${POSTGRES_USER:-nanodelta}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./secrets/db_password:/run/secrets/db_password:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nanodelta} -d ${POSTGRES_DB:-nanodelta}"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: ["no-new-privileges:true"]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-nanodelta}
      POSTGRES_USER: ${POSTGRES_USER:-nanodelta}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - ./secrets/db_password:/run/secrets/db_password:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["nanodelta-migrate", "--migrations", "/app/migrations"]
    restart: "no"
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-nanodelta}
      POSTGRES_USER: ${POSTGRES_USER:-nanodelta}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      NANODELTA_ADMIN_API_KEY_FILE: /run/secrets/admin_api_key
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./secrets/db_password:/run/secrets/db_password:ro
      - ./secrets/admin_api_key:/run/secrets/admin_api_key:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

  runtime:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-nanodelta}
      POSTGRES_USER: ${POSTGRES_USER:-nanodelta}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      NANODELTA_CYCLE_SECONDS: ${NANODELTA_CYCLE_SECONDS:-60}
      NANODELTA_HEARTBEAT_SECONDS: ${NANODELTA_HEARTBEAT_SECONDS:-10}
      NANODELTA_DRAIN_TIMEOUT_SECONDS: ${NANODELTA_DRAIN_TIMEOUT_SECONDS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./secrets/db_password:/run/secrets/db_password:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["nanodelta-runtime"]
    read_only: true
    tmpfs: [/tmp]
    stop_grace_period: 45s
    security_opt: ["no-new-privileges:true"]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

volumes:
  timescale_data:
