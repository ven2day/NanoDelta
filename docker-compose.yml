name: nanodelta
services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nanodelta}
      POSTGRES_USER: ${POSTGRES_USER:-nanodelta}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./secrets/db_password:/run/secrets/db_password:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nanodelta} -d ${POSTGRES_DB:-nanodelta}"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: ["no-new-privileges:true"]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-nanodelta}
      POSTGRES_USER: ${POSTGRES_USER:-nanodelta}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - ./secrets/db_password:/run/secrets/db_password:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["nanodelta-migrate", "--migrations", "/app/migrations"]
    restart: "no"
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-nanodelta}
      POSTGRES_USER: ${POSTGRES_USER:-nanodelta}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      NANODELTA_ADMIN_API_KEY_FILE: /run/secrets/admin_api_key
      NANODELTA_BACKEND_KEYS_PATH: /run/secrets/ui_backend_keys.json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./secrets/db_password:/run/secrets/db_password:ro
      - ./secrets/admin_api_key:/run/secrets/admin_api_key:ro
      - ./secrets/ui_backend_keys.json:/run/secrets/ui_backend_keys.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NANODELTA_API_URL: http://api:8000
      NANODELTA_UI_USERS_PATH: /run/secrets/ui_users.json
      NANODELTA_SESSION_KEY_PATH: /run/secrets/ui_session_key
      NANODELTA_BACKEND_KEYS_PATH: /run/secrets/ui_backend_keys.json
    volumes:
      - ./secrets/ui_users.json:/run/secrets/ui_users.json:ro
      - ./secrets/ui_session_key:/run/secrets/ui_session_key:ro
      - ./secrets/ui_backend_keys.json:/run/secrets/ui_backend_keys.json:ro
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

volumes:
  timescale_data:
