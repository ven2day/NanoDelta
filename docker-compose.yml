name: nanodelta
services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nanodelta}
      POSTGRES_USER: ${POSTGRES_USER:-nanodelta}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./secrets/db_password:/run/secrets/db_password:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nanodelta} -d ${POSTGRES_DB:-nanodelta}"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: ["no-new-privileges:true"]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-nanodelta}
      POSTGRES_USER: ${POSTGRES_USER:-nanodelta}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - ./secrets/db_password:/run/secrets/db_password:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["nanodelta-migrate", "--migrations", "/app/migrations"]
    restart: "no"
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-nanodelta}
      POSTGRES_USER: ${POSTGRES_USER:-nanodelta}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      NANODELTA_ADMIN_API_KEY_FILE: /run/secrets/admin_api_key
      NANODELTA_BACKEND_KEYS_PATH: /run/secrets/backend_keys.json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NANODELTA_HISTORY_ENABLED: ${NANODELTA_HISTORY_ENABLED:-false}
      NANODELTA_HISTORY_TIMEFRAMES: ${NANODELTA_HISTORY_TIMEFRAMES:-5m,15m,30m,1h,1d}
      NSE_DHAN_SECURITY_IDS_JSON: ${NSE_DHAN_SECURITY_IDS_JSON:-}
      NANODELTA_NSE_HOLIDAYS: ${NANODELTA_NSE_HOLIDAYS:-}
      NANODELTA_NSE_HOLIDAY_CALENDAR_YEAR: ${NANODELTA_NSE_HOLIDAY_CALENDAR_YEAR:-}
      TRUEDATA_USERNAME: ${TRUEDATA_USERNAME:-}
      TRUEDATA_PASSWORD_PATH: /run/secrets/truedata_password
      DHAN_CLIENT_ID: ${DHAN_CLIENT_ID:-}
      # Two mutually exclusive ways to authenticate to Dhan -- set DHAN_ACCESS_TOKEN_PATH
      # only if you're supplying a manually generated 24-hour token; leave it empty (the
      # default) to auto-generate one at startup from DHAN_PIN_PATH/DHAN_TOTP_SECRET_PATH.
      DHAN_ACCESS_TOKEN_PATH: ${DHAN_ACCESS_TOKEN_PATH:-}
      DHAN_PIN_PATH: /run/secrets/dhan_pin
      DHAN_TOTP_SECRET_PATH: /run/secrets/dhan_totp_secret
      FOREX_SYMBOLS: ${FOREX_SYMBOLS:-}
      OANDA_ACCOUNT_ID: ${OANDA_ACCOUNT_ID:-}
      OANDA_ACCESS_TOKEN_PATH: /run/secrets/oanda_access_token
      OANDA_ENVIRONMENT: ${OANDA_ENVIRONMENT:-practice}
      CRYPTO_SYMBOLS: ${CRYPTO_SYMBOLS:-}
      # Qwen/FinOps is optional -- leave QWEN_API_KEY empty to keep it disabled.
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_CHAT_COMPLETIONS_ENDPOINT: ${QWEN_CHAT_COMPLETIONS_ENDPOINT:-}
      QWEN_DEPLOYMENT_SCOPE: ${QWEN_DEPLOYMENT_SCOPE:-international}
      QWEN_BILLING_MODE: ${QWEN_BILLING_MODE:-SUBSCRIPTION}
      QWEN_DAILY_REQUEST_LIMIT: ${QWEN_DAILY_REQUEST_LIMIT:-}
      QWEN_DAILY_TOKEN_LIMIT: ${QWEN_DAILY_TOKEN_LIMIT:-}
      QWEN_DAILY_COST_LIMIT_USD: ${QWEN_DAILY_COST_LIMIT_USD:-}
      QWEN_SUBSCRIPTION_PLAN_ID: ${QWEN_SUBSCRIPTION_PLAN_ID:-}
      QWEN_SUBSCRIPTION_MONTHLY_FEE_USD: ${QWEN_SUBSCRIPTION_MONTHLY_FEE_USD:-}
      QWEN_SUBSCRIPTION_5H_REQUEST_LIMIT: ${QWEN_SUBSCRIPTION_5H_REQUEST_LIMIT:-}
      QWEN_SUBSCRIPTION_WEEKLY_REQUEST_LIMIT: ${QWEN_SUBSCRIPTION_WEEKLY_REQUEST_LIMIT:-}
      QWEN_SUBSCRIPTION_MONTHLY_REQUEST_LIMIT: ${QWEN_SUBSCRIPTION_MONTHLY_REQUEST_LIMIT:-}
    volumes:
      - ./secrets/db_password:/run/secrets/db_password:ro
      - ./secrets/admin_api_key:/run/secrets/admin_api_key:ro
      - ./secrets/backend_keys.json:/run/secrets/backend_keys.json:ro
      - ./secrets/truedata_password:/run/secrets/truedata_password:ro
      - ./secrets/dhan_access_token:/run/secrets/dhan_access_token:ro
      - ./secrets/dhan_pin:/run/secrets/dhan_pin:ro
      - ./secrets/dhan_totp_secret:/run/secrets/dhan_totp_secret:ro
      - ./secrets/oanda_access_token:/run/secrets/oanda_access_token:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

  runtime:
    profiles: ["market-runtime"]
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    entrypoint: ["nanodelta-runtime"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-nanodelta}
      POSTGRES_USER: ${POSTGRES_USER:-nanodelta}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      NANODELTA_RUNTIME_MODE: realtime-paper
      NANODELTA_INSTANCE_ID: ${NANODELTA_INSTANCE_ID:-compose-runtime}
      NANODELTA_HEARTBEAT_SECONDS: ${NANODELTA_HEARTBEAT_SECONDS:-10}
      NANODELTA_COMMAND_POLL_SECONDS: ${NANODELTA_COMMAND_POLL_SECONDS:-1}
      NANODELTA_DRAIN_TIMEOUT_SECONDS: ${NANODELTA_DRAIN_TIMEOUT_SECONDS:-30}
      NANODELTA_RUNTIME_METRICS_PORT: 9101
      NSE_DHAN_SECURITY_IDS_JSON: ${NSE_DHAN_SECURITY_IDS_JSON:-}
      NANODELTA_NSE_REALTIME_TIMEFRAMES: ${NANODELTA_NSE_REALTIME_TIMEFRAMES:-1m,5m,15m}
      NANODELTA_INDEX_FEED_ENABLED: ${NANODELTA_INDEX_FEED_ENABLED:-false}
      NANODELTA_INDEX_REALTIME_TIMEFRAMES: ${NANODELTA_INDEX_REALTIME_TIMEFRAMES:-1m,15m}
      NANODELTA_NSE_HOLIDAYS: ${NANODELTA_NSE_HOLIDAYS:-}
      NANODELTA_NSE_HOLIDAY_CALENDAR_YEAR: ${NANODELTA_NSE_HOLIDAY_CALENDAR_YEAR:-}
      TRUEDATA_USERNAME: ${TRUEDATA_USERNAME:-}
      TRUEDATA_PASSWORD_PATH: /run/secrets/truedata_password
      DHAN_CLIENT_ID: ${DHAN_CLIENT_ID:-}
      # Two mutually exclusive ways to authenticate to Dhan -- set DHAN_ACCESS_TOKEN_PATH
      # only if you're supplying a manually generated 24-hour token; leave it empty (the
      # default) to auto-generate one at startup from DHAN_PIN_PATH/DHAN_TOTP_SECRET_PATH.
      DHAN_ACCESS_TOKEN_PATH: ${DHAN_ACCESS_TOKEN_PATH:-}
      DHAN_PIN_PATH: /run/secrets/dhan_pin
      DHAN_TOTP_SECRET_PATH: /run/secrets/dhan_totp_secret
      FOREX_SYMBOLS: ${FOREX_SYMBOLS:-}
      OANDA_ACCOUNT_ID: ${OANDA_ACCOUNT_ID:-}
      OANDA_ACCESS_TOKEN_PATH: /run/secrets/oanda_access_token
      OANDA_ENVIRONMENT: ${OANDA_ENVIRONMENT:-practice}
      CRYPTO_SYMBOLS: ${CRYPTO_SYMBOLS:-}
      NANODELTA_PAPER_ACCOUNT_ID: ${NANODELTA_PAPER_ACCOUNT_ID:-paper-default}
      NANODELTA_PAPER_EQUITY_INR: ${NANODELTA_PAPER_EQUITY_INR:-}
      NANODELTA_PAPER_RISK_PER_TRADE_INR: ${NANODELTA_PAPER_RISK_PER_TRADE_INR:-}
      NANODELTA_PAPER_MAX_POSITIONS: ${NANODELTA_PAPER_MAX_POSITIONS:-}
      NANODELTA_PAPER_MAX_SECTOR_POSITIONS: ${NANODELTA_PAPER_MAX_SECTOR_POSITIONS:-}
      NANODELTA_PAPER_SLIPPAGE_BPS: ${NANODELTA_PAPER_SLIPPAGE_BPS:-2}
      NANODELTA_PAPER_FEE_BPS: ${NANODELTA_PAPER_FEE_BPS:-1}
      NANODELTA_TRADEABILITY_MIN_PRICE: ${NANODELTA_TRADEABILITY_MIN_PRICE:-20.0}
      NANODELTA_TRADEABILITY_MIN_AVG_VOLUME: ${NANODELTA_TRADEABILITY_MIN_AVG_VOLUME:-10000.0}
      NANODELTA_TRADEABILITY_MIN_AVG_TRADED_VALUE: ${NANODELTA_TRADEABILITY_MIN_AVG_TRADED_VALUE:-1000000.0}
      NANODELTA_TRADEABILITY_MIN_ATR_PCT: ${NANODELTA_TRADEABILITY_MIN_ATR_PCT:-0.001}
      NANODELTA_TRADEABILITY_MAX_ATR_PCT: ${NANODELTA_TRADEABILITY_MAX_ATR_PCT:-0.08}
      NANODELTA_TRADEABILITY_MAX_GAP_PCT: ${NANODELTA_TRADEABILITY_MAX_GAP_PCT:-0.05}
      NANODELTA_TRADEABILITY_AVERAGE_WINDOW: ${NANODELTA_TRADEABILITY_AVERAGE_WINDOW:-20}
      NANODELTA_SYMBOL_REGIME_ADX_NO_TREND: ${NANODELTA_SYMBOL_REGIME_ADX_NO_TREND:-20.0}
      NANODELTA_SYMBOL_REGIME_ADX_STRONG_TREND: ${NANODELTA_SYMBOL_REGIME_ADX_STRONG_TREND:-35.0}
      NANODELTA_SYMBOL_REGIME_MIN_FIT: ${NANODELTA_SYMBOL_REGIME_MIN_FIT:-0.4}
      NANODELTA_SYMBOL_REGIME_MAX_FIT: ${NANODELTA_SYMBOL_REGIME_MAX_FIT:-1.2}
      NANODELTA_SYMBOL_REGIME_MISALIGNED_PENALTY: ${NANODELTA_SYMBOL_REGIME_MISALIGNED_PENALTY:-0.7}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./secrets/db_password:/run/secrets/db_password:ro
      - ./secrets/truedata_password:/run/secrets/truedata_password:ro
      - ./secrets/dhan_access_token:/run/secrets/dhan_access_token:ro
      - ./secrets/dhan_pin:/run/secrets/dhan_pin:ro
      - ./secrets/dhan_totp_secret:/run/secrets/dhan_totp_secret:ro
      - ./secrets/oanda_access_token:/run/secrets/oanda_access_token:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    stop_grace_period: 45s
    expose: ["9101"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/metrics', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    security_opt: ["no-new-privileges:true"]

  history:
    profiles: ["market-runtime"]
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    entrypoint: ["nanodelta-history"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-nanodelta}
      POSTGRES_USER: ${POSTGRES_USER:-nanodelta}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      NANODELTA_HISTORY_TIMEFRAMES: ${NANODELTA_HISTORY_TIMEFRAMES:-5m,15m,30m,1h,1d}
      NANODELTA_HISTORY_SYNC_INTERVAL_SECONDS: ${NANODELTA_HISTORY_SYNC_INTERVAL_SECONDS:-86400}
      NANODELTA_HISTORY_CONCURRENCY: ${NANODELTA_HISTORY_CONCURRENCY:-5}
      NANODELTA_HISTORY_HEALTH_PORT: 9102
      NANODELTA_INDEX_FEED_ENABLED: ${NANODELTA_INDEX_FEED_ENABLED:-false}
      NSE_DHAN_SECURITY_IDS_JSON: ${NSE_DHAN_SECURITY_IDS_JSON:-}
      TRUEDATA_USERNAME: ${TRUEDATA_USERNAME:-}
      TRUEDATA_PASSWORD_PATH: /run/secrets/truedata_password
      DHAN_CLIENT_ID: ${DHAN_CLIENT_ID:-}
      # Two mutually exclusive ways to authenticate to Dhan -- set DHAN_ACCESS_TOKEN_PATH
      # only if you're supplying a manually generated 24-hour token; leave it empty (the
      # default) to auto-generate one at startup from DHAN_PIN_PATH/DHAN_TOTP_SECRET_PATH.
      DHAN_ACCESS_TOKEN_PATH: ${DHAN_ACCESS_TOKEN_PATH:-}
      DHAN_PIN_PATH: /run/secrets/dhan_pin
      DHAN_TOTP_SECRET_PATH: /run/secrets/dhan_totp_secret
      FOREX_SYMBOLS: ${FOREX_SYMBOLS:-}
      OANDA_ACCOUNT_ID: ${OANDA_ACCOUNT_ID:-}
      OANDA_ACCESS_TOKEN_PATH: /run/secrets/oanda_access_token
      OANDA_ENVIRONMENT: ${OANDA_ENVIRONMENT:-practice}
      CRYPTO_SYMBOLS: ${CRYPTO_SYMBOLS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./secrets/db_password:/run/secrets/db_password:ro
      - ./secrets/truedata_password:/run/secrets/truedata_password:ro
      - ./secrets/dhan_access_token:/run/secrets/dhan_access_token:ro
      - ./secrets/dhan_pin:/run/secrets/dhan_pin:ro
      - ./secrets/dhan_totp_secret:/run/secrets/dhan_totp_secret:ro
      - ./secrets/oanda_access_token:/run/secrets/oanda_access_token:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    stop_grace_period: 45s
    expose: ["9102"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9102/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    security_opt: ["no-new-privileges:true"]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      NANODELTA_BACKEND_URL: http://api:8000
      NANODELTA_BACKEND_KEYS_PATH: /run/secrets/backend_keys.json
      # Session cookies default to Secure (HTTPS-only). Only set this to "false" for a
      # deployment with no TLS in front of it yet -- with a Secure cookie and no TLS,
      # the browser silently discards the cookie and every request looks unauthenticated.
      NANODELTA_WEB_COOKIE_SECURE: ${NANODELTA_WEB_COOKIE_SECURE:-true}
    volumes:
      - ./secrets/admin_api_key:/run/secrets/admin_api_key:ro
      - ./secrets/backend_keys.json:/run/secrets/backend_keys.json:ro
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/prometheus/alerts.yml:/etc/prometheus/rules/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
      alertmanager:
        condition: service_started
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

  alertmanager:
    image: prom/alertmanager:v0.28.0
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ${ALERTMANAGER_CONFIG_PATH:-./deploy/observability/alertmanager/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    secrets: [grafana_admin_password]
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    security_opt: ["no-new-privileges:true"]

volumes:
  timescale_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:

secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
