name: nanodelta-external-timescale

# Standalone application topology for a provider-managed PostgreSQL/Timescale writer endpoint.
# This manifest does not create a replica or perform failover; those are provider responsibilities.
x-database: &database
  POSTGRES_HOST: ${POSTGRES_WRITER_HOST:?managed writer endpoint is required}
  POSTGRES_DB: ${POSTGRES_DB:-nanodelta}
  POSTGRES_USER: ${POSTGRES_USER:-nanodelta}
  POSTGRES_PASSWORD_FILE: /run/secrets/db_password

x-database-volume: &database-volume
  - ${POSTGRES_PASSWORD_FILE:?host password file is required}:/run/secrets/db_password:ro

services:
  migrate:
    image: ${API_IMAGE:?immutable API image digest is required}
    environment: *database
    volumes: *database-volume
    command: ["nanodelta-migrate", "--migrations", "/app/migrations"]
    restart: "no"
    security_opt: ["no-new-privileges:true"]

  api:
    image: ${API_IMAGE:?immutable API image digest is required}
    restart: unless-stopped
    environment:
      <<: *database
      NANODELTA_ADMIN_API_KEY_FILE: /run/secrets/admin_api_key
      NANODELTA_BACKEND_KEYS_PATH: /run/secrets/backend_keys.json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${POSTGRES_PASSWORD_FILE:?host password file is required}:/run/secrets/db_password:ro
      - ./secrets/admin_api_key:/run/secrets/admin_api_key:ro
      - ./secrets/backend_keys.json:/run/secrets/backend_keys.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

  runtime:
    profiles: ["market-runtime"]
    image: ${API_IMAGE:?immutable API image digest is required}
    restart: unless-stopped
    entrypoint: ["nanodelta-entrypoint"]
    command: ["nanodelta-runtime"]
    environment:
      <<: *database
      NANODELTA_RUNTIME_MODE: realtime-paper
      NANODELTA_INSTANCE_ID: ${NANODELTA_INSTANCE_ID:-external-timescale-runtime}
      NSE_DHAN_SECURITY_IDS_JSON: ${NSE_DHAN_SECURITY_IDS_JSON:-}
      TRUEDATA_USERNAME: ${TRUEDATA_USERNAME:-}
      TRUEDATA_PASSWORD_PATH: /run/secrets/truedata_password
      DHAN_CLIENT_ID: ${DHAN_CLIENT_ID:-}
      DHAN_ACCESS_TOKEN_PATH: /run/secrets/dhan_access_token
      FOREX_SYMBOLS: ${FOREX_SYMBOLS:-}
      OANDA_ACCOUNT_ID: ${OANDA_ACCOUNT_ID:-}
      OANDA_ACCESS_TOKEN_PATH: /run/secrets/oanda_access_token
      OANDA_ENVIRONMENT: ${OANDA_ENVIRONMENT:-practice}
      CRYPTO_SYMBOLS: ${CRYPTO_SYMBOLS:-}
      NANODELTA_PAPER_ACCOUNT_ID: ${NANODELTA_PAPER_ACCOUNT_ID:-paper-default}
      NANODELTA_PAPER_EQUITY_INR: ${NANODELTA_PAPER_EQUITY_INR:-}
      NANODELTA_PAPER_RISK_PER_TRADE_INR: ${NANODELTA_PAPER_RISK_PER_TRADE_INR:-}
      NANODELTA_PAPER_MAX_POSITIONS: ${NANODELTA_PAPER_MAX_POSITIONS:-}
      NANODELTA_PAPER_MAX_SECTOR_POSITIONS: ${NANODELTA_PAPER_MAX_SECTOR_POSITIONS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${POSTGRES_PASSWORD_FILE:?host password file is required}:/run/secrets/db_password:ro
      - ./secrets/truedata_password:/run/secrets/truedata_password:ro
      - ./secrets/dhan_access_token:/run/secrets/dhan_access_token:ro
      - ./secrets/oanda_access_token:/run/secrets/oanda_access_token:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    stop_grace_period: 45s
    security_opt: ["no-new-privileges:true"]

  web:
    image: ${WEB_IMAGE:?immutable web image digest is required}
    restart: unless-stopped
    environment:
      NANODELTA_BACKEND_URL: http://api:8000
      NANODELTA_BACKEND_KEYS_PATH: /run/secrets/backend_keys.json
      NANODELTA_WEB_USERNAME_FILE: /run/secrets/web_username
      NANODELTA_WEB_PASSWORD_FILE: /run/secrets/web_password
      NANODELTA_WEB_SESSION_SECRET_FILE: /run/secrets/web_session_secret
      NANODELTA_WEB_ROLE: ${NANODELTA_WEB_ROLE:-viewer}
    volumes:
      - ./secrets/backend_keys.json:/run/secrets/backend_keys.json:ro
      - ./secrets/web_username:/run/secrets/web_username:ro
      - ./secrets/web_password:/run/secrets/web_password:ro
      - ./secrets/web_session_secret:/run/secrets/web_session_secret:ro
    depends_on:
      api:
        condition: service_healthy
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
