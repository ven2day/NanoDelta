groups:
  - name: nanodelta-api
    rules:
      - alert: NanoDeltaApiUnavailable
        expr: up{job="nanodelta-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: NanoDelta API metrics target is unavailable
          description: Prometheus has failed to scrape the API for two minutes.
      - alert: NanoDeltaHighServerErrorRate
        expr: |
          sum(rate(nanodelta_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(nanodelta_http_requests_total[5m])), 0.001)
          > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: NanoDelta API server error rate exceeds 5%
          description: The rolling five-minute error ratio has remained high for ten minutes.
      - alert: NanoDeltaHighApiLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(nanodelta_http_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: NanoDelta API p95 latency exceeds one second
          description: API p95 latency has remained over one second for ten minutes.
