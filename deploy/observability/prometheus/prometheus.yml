global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: nanodelta-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: nanodelta-runtime
    metrics_path: /metrics
    static_configs:
      - targets: ["runtime:9101"]
        labels:
          service: runtime
