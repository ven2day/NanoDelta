[project]
name = "nanodelta"
version = "0.1.0"
description = "Market-isolated Bronze, Silver, and Gold ETL for NSE, Forex, and Crypto"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.135,<0.142",
  "starlette>=1.3.1,<2",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "prometheus-client>=0.21,<1",
  "websockets>=12,<16",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]
truedata = ["truedata>=0.1"]

[project.scripts]
nanodelta-migrate = "nanodelta.persistence.cli:main"
nanodelta-runtime = "nanodelta.runtime.cli:main"
nanodelta-strategy = "nanodelta.strategies.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nanodelta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["nanodelta"]
mypy_path = "src"
